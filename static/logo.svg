<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- 7G Logo - 圆形黑底，像素风，零间距居中 -->
  <!-- 7: 霓虹绿 #39FF14, G上半: 霓虹绿, G下半+横划: 霓虹青 #FF00FF -->

  <!-- 圆形黑色背景 -->
  <circle cx="32" cy="32" r="32" fill="#0a0a0a"/>

  <!-- ===== "7" 像素字形 ===== -->
  <!-- 横划 - 品红 -->
  <rect x="12" y="16" width="4" height="4" fill="#FF00FF"/>
  <rect x="16" y="16" width="4" height="4" fill="#FF00FF"/>
  <rect x="20" y="16" width="4" height="4" fill="#FF00FF"/>
  <rect x="24" y="16" width="4" height="4" fill="#FF00FF"/>
  <rect x="28" y="16" width="4" height="4" fill="#FF00FF"/>
  <rect x="28" y="20" width="4" height="4" fill="#39FF14"/>
  <rect x="24" y="24" width="4" height="4" fill="#39FF14"/>
  <rect x="24" y="28" width="4" height="4" fill="#39FF14"/>
  <rect x="20" y="32" width="4" height="4" fill="#39FF14"/>
  <rect x="20" y="36" width="4" height="4" fill="#39FF14"/>
  <rect x="16" y="40" width="4" height="4" fill="#39FF14"/>
  <rect x="16" y="44" width="4" height="4" fill="#39FF14"/>

  <!-- ===== "G" 上半部分 - 霓虹绿 ===== -->
  <!-- 顶部横划 -->
  <rect x="32" y="16" width="4" height="4" fill="#39FF14"/>
  <rect x="36" y="16" width="4" height="4" fill="#39FF14"/>
  <rect x="40" y="16" width="4" height="4" fill="#39FF14"/>
  <rect x="44" y="16" width="4" height="4" fill="#39FF14"/>
  <rect x="48" y="16" width="4" height="4" fill="#39FF14"/>
  <!-- 左竖上半 -->
  <rect x="32" y="20" width="4" height="4" fill="#39FF14"/>
  <rect x="32" y="24" width="4" height="4" fill="#39FF14"/>

  <!-- ===== "G" 下半部分 - 霓虹青 ===== -->
  <!-- 中间横划 -->
  <rect x="32" y="28" width="4" height="4" fill="#FF00FF"/>
  <rect x="40" y="28" width="4" height="4" fill="#FF00FF"/>
  <rect x="44" y="28" width="4" height="4" fill="#FF00FF"/>
  <rect x="48" y="28" width="4" height="4" fill="#FF00FF"/>
  <!-- 左竖下半 -->
  <rect x="32" y="32" width="4" height="4" fill="#FF00FF"/>
  <rect x="32" y="36" width="4" height="4" fill="#FF00FF"/>
  <rect x="32" y="40" width="4" height="4" fill="#FF00FF"/>
  <!-- 右竖下半 -->
  <rect x="48" y="32" width="4" height="4" fill="#FF00FF"/>
  <rect x="48" y="36" width="4" height="4" fill="#FF00FF"/>
  <rect x="48" y="40" width="4" height="4" fill="#FF00FF"/>
  <!-- 底部横划 -->
  <rect x="32" y="44" width="4" height="4" fill="#FF00FF"/>
  <rect x="36" y="44" width="4" height="4" fill="#FF00FF"/>
  <rect x="40" y="44" width="4" height="4" fill="#FF00FF"/>
  <rect x="44" y="44" width="4" height="4" fill="#FF00FF"/>
  <rect x="48" y="44" width="4" height="4" fill="#FF00FF"/>
</svg>